<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odczyty mediów</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikony/ikona.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1565c0">
  <link rel="stylesheet" href="css/styl.css">
</head>
<body>

  <header class="naglowek">
    <button id="przycisk-home" class="przycisk-ikona" aria-label="Menu główne" title="Menu główne">
      <img class="ikona-naglowka" src="ikony/home.svg" alt="">
    </button>
    <h1 class="naglowek__tytul">Odczyty mediów</h1>
    <button id="przycisk-ustawienia" class="przycisk-ikona" aria-label="Ustawienia" title="Ustawienia">
      <img class="ikona-naglowka" src="ikony/ustawienia.svg" alt="">
    </button>
  </header>

  <main>

    <!-- Ekran startowy — jedna kolumna kart: najpierw media (po jednej karcie
         na medium, rozpoznawane przez atrybut data-medium), pod nimi Kocioł
         i Podgląd. Od 0.17.0 wszystkie mają ten sam kształt (ikona z lewej,
         tytuł i krótki opis) — wcześniej media były kwadratowymi kafelkami
         w siatce 2x2. -->
    <section id="ekran-start" class="ekran">
      <div class="karty-mediow">
        <button class="karta" data-medium="gaz">
          <img class="karta__ikona" src="ikony/gaz.svg" alt="">
          <span class="karta__tekst">
            <span class="karta__tytul">Gaz</span>
            <span class="karta__opis">Stan w m³</span>
          </span>
        </button>
        <button class="karta" data-medium="woda">
          <img class="karta__ikona" src="ikony/woda.svg" alt="">
          <span class="karta__tekst">
            <span class="karta__tytul">Woda</span>
            <span class="karta__opis">Stan w m³</span>
          </span>
        </button>
        <button class="karta" data-medium="prad_t1">
          <img class="karta__ikona" src="ikony/prad.svg" alt="">
          <span class="karta__tekst">
            <span class="karta__tytul">Prąd T1</span>
            <span class="karta__opis">Stan w kWh, taryfa szczytowa</span>
          </span>
        </button>
        <button class="karta" data-medium="prad_t2">
          <img class="karta__ikona" src="ikony/prad.svg" alt="">
          <span class="karta__tekst">
            <span class="karta__tytul">Prąd T2</span>
            <span class="karta__opis">Stan w kWh, druga taryfa</span>
          </span>
        </button>
        <button class="karta" data-medium="prad_suma">
          <img class="karta__ikona" src="ikony/prad.svg" alt="">
          <span class="karta__tekst">
            <span class="karta__tytul">Prąd suma</span>
            <span class="karta__opis">Stan w kWh, obie taryfy razem</span>
          </span>
        </button>
      </div>

      <!-- Kocioł to nie medium do okresowego odczytu, tylko dziennik zmian
           nastaw. Wygląda jak karty mediów, ale jest oddzielony od nich
           większym odstępem (klasa karta--osobna). -->
      <button id="przycisk-kociol" class="karta karta--osobna">
        <img class="karta__ikona" src="ikony/kociol.svg" alt="">
        <span class="karta__tekst">
          <span class="karta__tytul">Kocioł</span>
          <span class="karta__opis">Zmiana nastaw</span>
        </span>
      </button>

      <!-- Podgląd z arkusza (punkt 6 backlogu) — tylko do odczytu, żeby
           sprawdzić z telefonu ostatnie wpisy i temperatury bez wchodzenia
           do Arkusza Google. -->
      <button id="przycisk-podglad" class="karta">
        <img class="karta__ikona" src="ikony/podglad.svg" alt="">
        <span class="karta__tekst">
          <span class="karta__tytul">Podgląd</span>
          <span class="karta__opis">Ostatnie odczyty i temperatury</span>
        </span>
      </button>

      <p id="komunikat-start" class="komunikat-sukces ukryty"></p>
      <p id="komunikat-kolejka" class="komunikat-kolejka ukryty"></p>
    </section>

    <!-- Ekran wyboru metody — tylko dla mediów z listy MEDIA_ZE_ZDJECIEM
         (na dziś: gaz). Reszta mediów pomija ten ekran, idzie od razu
         do ręcznego wpisu. -->
    <section id="ekran-wybor-metody" class="ekran ukryty">
      <h2 id="wybor-metody-tytul"></h2>
      <div class="przyciski-formularza">
        <button type="button" id="przycisk-zdjecie" class="przycisk-glowny">
          <img class="ikona-przycisku" src="ikony/aparat.svg" alt="">Zrób zdjęcie
        </button>
        <button type="button" id="przycisk-galeria" class="przycisk-drugorzedny">
          <img class="ikona-przycisku" src="ikony/galeria.svg" alt="">Wybierz z galerii
        </button>
        <button type="button" id="przycisk-recznie" class="przycisk-drugorzedny">
          <img class="ikona-przycisku" src="ikony/recznie.svg" alt="">Wpisz ręcznie
        </button>
        <button type="button" id="przycisk-anuluj-wybor" class="przycisk-drugorzedny">Anuluj</button>
      </div>
    </section>

    <!-- Ekran potwierdzenia odczytu — wartość oraz data i godzina, obie
         edytowalne. Przy odczycie ze zdjęcia pokazuje jego podgląd, żeby
         można było przepisać wskazanie — model wizyjny dojdzie w punkcie 6. -->
    <section id="ekran-potwierdzenia" class="ekran ukryty">
      <h2 id="potwierdzenie-tytul"></h2>
      <img id="podglad-zdjecia" class="podglad-zdjecia ukryty" alt="Zdjęcie licznika">
      <form id="formularz-potwierdzenia">
        <label class="pole-formularza">
          Stan licznika (<span id="potwierdzenie-jednostka"></span>)
          <input type="number" id="pole-stan" inputmode="decimal" min="0" required>
        </label>
        <label class="pole-formularza">
          Data i godzina odczytu
          <input type="datetime-local" id="pole-data-godzina" required>
        </label>
        <p id="uwaga-czasu" class="uwaga-pola ukryty" role="status"></p>
        <div class="przyciski-formularza">
          <button type="submit" id="przycisk-zatwierdz" class="przycisk-glowny">Zatwierdź</button>
          <button type="button" id="przycisk-anuluj-potwierdzenie" class="przycisk-drugorzedny">Anuluj</button>
        </div>
        <p id="komunikat-potwierdzenia" class="komunikat ukryty"></p>
      </form>
    </section>

    <!-- Ekran kotła — dziennik zmian nastaw, nie okresowy odczyt. Formularz
         podpowiada ostatnio zapisane wartości (pobrane z webhooka); wysyłka
         idzie tylko wtedy, gdy coś faktycznie się różni od tej podpowiedzi. -->
    <section id="ekran-kociol" class="ekran ukryty">
      <h2>Kocioł</h2>
      <form id="formularz-kotla">
        <div class="pole-formularza">
          Tryb
          <div class="segment-tryb" id="segment-tryb" role="radiogroup" aria-label="Tryb pracy kotła">
            <span class="segment-tryb__wskaznik" aria-hidden="true"></span>
            <button type="button" class="segment-tryb__opcja" data-wartosc="off" role="radio" aria-checked="true">Wył.</button>
            <button type="button" class="segment-tryb__opcja" data-wartosc="cwu" role="radio" aria-checked="false">CWU</button>
            <button type="button" class="segment-tryb__opcja" data-wartosc="co" role="radio" aria-checked="false">CO</button>
            <button type="button" class="segment-tryb__opcja" data-wartosc="cwu_co" role="radio" aria-checked="false">CWU+CO</button>
          </div>
        </div>
        <label class="pole-formularza">
          Krzywa grzewcza (puste przy samym CWU)
          <input type="number" id="pole-krzywa" inputmode="decimal" step="0.1" min="0">
        </label>
        <label class="pole-formularza">
          Przesunięcie (puste przy samym CWU)
          <input type="number" id="pole-przesuniecie" inputmode="numeric" step="1">
        </label>
        <label class="pole-formularza">
          Temperatura CWU (°C)
          <input type="number" id="pole-temp-cwu" inputmode="numeric" step="1" min="0" required>
        </label>

        <div class="blok-cyrkulacji">
          <p class="etykieta-cyrkulacji">Cyrkulacja — przedziały czasu</p>
          <div id="lista-cyrkulacji"></div>
          <button type="button" id="przycisk-dodaj-przedzial" class="przycisk-drugorzedny">
            + Dodaj przedział
          </button>
        </div>

        <label class="pole-formularza">
          Obowiązuje od
          <input type="datetime-local" id="pole-obowiazuje-od" required>
        </label>

        <div class="przyciski-formularza">
          <button type="submit" id="przycisk-zapisz-kociol" class="przycisk-glowny">Zapisz zmianę</button>
          <button type="button" id="przycisk-anuluj-kociol" class="przycisk-drugorzedny">Anuluj</button>
        </div>
        <p id="komunikat-kotla" class="komunikat ukryty"></p>
      </form>
    </section>

    <!-- Ekran podglądu — tylko do odczytu, dwie listy danych z arkusza:
         ostatnie odczyty (wszystkie media razem, najnowsze pierwsze)
         i temperatury dobowe z ostatniego miesiąca (jedna kolumna
         na czujnik — liczba i nazwy czujników przychodzą z webhooka,
         nie są tu zaszyte na sztywno). -->
    <section id="ekran-podglad" class="ekran ukryty">
      <h2>Podgląd</h2>

      <!-- Każdy z dwóch bloków ma własny wiersz statusu (wczytywanie / czas
           wczytania / błąd), bo wczytują się niezależnie od siebie. -->
      <h3 class="podglad__naglowek">Ostatnie odczyty</h3>
      <p id="status-odczytow" class="status-bloku ukryty" role="status"></p>
      <div id="lista-ostatnich-odczytow" class="lista-odczytow"></div>

      <h3 class="podglad__naglowek">Temperatury dobowe (ostatni miesiąc)</h3>
      <p id="status-temperatur" class="status-bloku ukryty" role="status"></p>
      <div class="tabela-temperatur-kontener">
        <table id="tabela-temperatur" class="tabela-temperatur"></table>
      </div>

      <div class="przyciski-formularza">
        <button type="button" id="przycisk-zamknij-podglad" class="przycisk-drugorzedny">Zamknij</button>
      </div>
    </section>

    <!-- Ekran ustawień — adres webhooka i token, zapisywane w localStorage. -->
    <section id="ekran-ustawienia" class="ekran ukryty">
      <h2>Ustawienia</h2>
      <p class="opis">
        Adres webhooka i token łączą aplikację z Arkuszem Google. Wpisujesz je
        raz — zostają zapisane tylko w tej przeglądarce, na tym telefonie.
      </p>
      <form id="formularz-ustawien">
        <label class="pole-formularza">
          Adres webhooka
          <input type="url" id="pole-adres" placeholder="https://script.google.com/macros/s/..." required>
        </label>
        <label class="pole-formularza">
          Token
          <input type="text" id="pole-token" placeholder="token dostępu" required>
        </label>
        <div class="przyciski-formularza">
          <button type="submit" class="przycisk-glowny">Zapisz</button>
          <button type="button" id="przycisk-anuluj" class="przycisk-drugorzedny">Anuluj</button>
        </div>
        <p id="komunikat-ustawien" class="komunikat ukryty"></p>
      </form>
    </section>

  </main>

  <footer class="stopka">wersja <span id="numer-wersji"></span></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
